apiVersion: batch/v1
kind: Job
metadata:
  name: ml-benchmark
  labels:
    app: ml-benchmark
spec:
  template:
    spec:
      containers:
        - name: benchmark
          image: ml-benchmark-pipeline:latest
          command: ["python", "main.py", "--epochs", "5"]
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      restartPolicy: Never
  backoffLimit: 2